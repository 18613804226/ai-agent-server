services:
  # 1. 带 pgvector 插件的 PostgreSQL 数据库
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres-vector
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # 2G 小机器：限制数据库资源，避免和后端抢内存/CPU
    command: >
      postgres
      -c shared_buffers=128MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c effective_cache_size=256MB
      -c max_connections=50
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 512M
        reservations:
          memory: 256M
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - app-network

  # 1.5 一次性任务：把 Prisma schema 同步到数据库（项目无 migrations，只有 db push）。
  #     跑完即退出；backend 等它成功后才启动，避免启动瞬间 Prisma 报「列不存在」。
  #     prisma 是 @repo/server 的运行时依赖，生产镜像里自带 CLI：
  #     /app/apps/server/node_modules/prisma（Dockerfile 第 8 步会断言它真的能跑）。
  #     用 node 直接跑入口文件，不依赖 .bin 软链的可执行位。
  db-push:
    image: my-backend-app:latest
    container_name: ai-agent-db-push
    restart: "no"
    entrypoint: ["node", "/app/apps/server/node_modules/prisma/build/index.js"]
    command: ["db", "push"]
    working_dir: /app/apps/server
    environment:
      # 容器内用服务名连库；变量来自 --env-file apps/server/.env
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=public"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  # 2. NestJS 后端服务（monorepo 根目录作为构建上下文）
  backend:
    build: .
    image: my-backend-app:latest
    container_name: ai-agent-backend
    restart: unless-stopped
    environment:
      # 限制 Node 堆，防止 2G 机器被后端吃光
      NODE_OPTIONS: '--max-old-space-size=512'
    deploy:
      resources:
        limits:
          cpus: '1.2'
          memory: 768M
        reservations:
          memory: 384M
    ports:
      - "4001:3000"
    volumes:
      # ⚠️ 图片和聊天附件都写在容器可写层；不挂卷的话每次重建 backend 容器
      #    （每次部署都会 Recreate）文件就没了，但 DB 里的 URL 还在 → 历史图片 404。
      #    路径对应 main.ts / image.service.ts 的 process.cwd() = /app/apps/server。
      - uploads:/app/apps/server/uploads
      - chat-files:/app/apps/server/files
    env_file:
      - apps/server/.env
    depends_on:
      postgres:
        condition: service_healthy
      db-push:
        # ✅ 表结构同步成功后才启动后端；db push 失败（比如有破坏性变更）就别硬起
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app-network

volumes:
  pgdata:
  uploads:
  chat-files:

networks:
  app-network:
    driver: bridge
