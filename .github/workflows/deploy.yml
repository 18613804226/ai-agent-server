name: Deploy to Aliyun ECS

on:
  push:
    branches: [main] # 当你往 main 分支 push 代码时自动触发
    paths-ignore:
      - 'packages/editor-agent/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Deploy to Aliyun via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 60m
          script: |
            set -e
            # 1. 进入服务器上的项目源码目录（根据你的实际路径调整）
            cd /root/dietai-backend/ai-agent-server

            # 2. 强制对齐远端：fetch + reset --hard。
            #    用 pull 时若本地有改动/分叉会静默失败 → 源码没更新 → Docker 全部命中缓存
            #    → 几十秒“构建”完但镜像没重建（站点照旧是旧代码）。reset 只动被跟踪文件，
            #    不影响 gitignore 的 .env。echo 出提交号，方便确认这次到底部署了哪版。
            git fetch origin main
            git reset --hard origin/main
            echo "==> 部署提交: $(git rev-parse --short HEAD) $(git log -1 --pretty=%s)"

            # 2.5 .env 被 gitignore，不随 git reset 变动；monorepo 后预期在 apps/server/.env。
            #     若缺失（新机器/误删），手动创建一次即可，参考 apps/server/.env.example
            if [ ! -f apps/server/.env ]; then
              echo "==> 缺少 apps/server/.env，请创建（参考 apps/server/.env.example）"
              exit 1
            fi

            # 3. 构建镜像：限制 buildkit 内存/CPU，避免 2G 小机器被构建卡死。
            #    ⚠️ 构建是 CPU 密集型操作，2 核机器上会跑满 CPU；如果部署时机器卡死，
            #    建议在 CI（ubuntu-latest）里构建并推送到镜像仓库，ECS 只 pull。
            docker buildx build \
              --memory 1500m \
              --cpu-period 100000 --cpu-quota 150000 \
              -t my-backend-app:latest . \
              || docker compose -f docker-compose.4001.yml --env-file apps/server/.env build

            # 4. 同步数据库表结构。本项目没有 prisma/migrations，必须用 `db push`
            #    （不是 migrate deploy，那个没迁移文件时什么都不做）。
            #    在一次性容器里跑：用刚构建的 backend 镜像（prisma CLI 已在镜像里，
            #    构建期装好，运行时无需联网下载）。--no-deps：postgres 上一步已起。
            #    Prisma 7 的 db push 不认 --skip-generate；schema 的 datasource 没有 url，
            #    所以用 --url 传连接串。`sh -c '...'` 单引号包住，让 $DATABASE_URL 在
            #    容器内（.env 注入）展开，宿主机 shell 拿不到这个变量。
            #    不加 --accept-data-loss，避免非交互下静默删列/删表。
            #    ⚠️ 后端还没启动，db push 不会和运行中的后端抢 CPU/内存。
            docker compose -f docker-compose.4001.yml --env-file apps/server/.env run --rm --no-deps \
              backend sh -c 'npx prisma db push --url "$DATABASE_URL"'

            # 5. 再启动/更新容器
            docker compose -f docker-compose.4001.yml --env-file apps/server/.env up -d --no-build

            # 6. 清理未使用的旧镜像，防止服务器磁盘被撑满.
            docker image prune -f
