name: Deploy to Aliyun ECS

on:
  push:
    branches: [main] # 当你往 main 分支 push 代码时自动触发

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Deploy to Aliyun via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 60m
          script: |
            set -e
            # 1. 进入服务器上的项目源码目录（根据你的实际路径调整）
            cd /root/dietai-backend/ai-agent-server

            # 2. 强制对齐远端：fetch + reset --hard。
            #    用 pull 时若本地有改动/分叉会静默失败 → 源码没更新 → Docker 全部命中缓存
            #    → 几十秒“构建”完但镜像没重建（站点照旧是旧代码）。reset 只动被跟踪文件，
            #    不影响 gitignore 的 .env。echo 出提交号，方便确认这次到底部署了哪版。
            git fetch origin main
            git reset --hard origin/main
            echo "==> 部署提交: $(git rev-parse --short HEAD) $(git log -1 --pretty=%s)"

            # 3. 重新构建镜像并启动容器（Docker Compose 会自动应用最新的代码和配置）
            docker compose -f docker-compose.4001.yml --env-file .env up -d --build

            # 4. 清理未使用的旧镜像，防止服务器磁盘被撑满.
            docker image prune -f
