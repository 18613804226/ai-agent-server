name: Deploy to Aliyun ECS

on:
  push:
    branches: [main] # 当你往 main 分支 push 代码时自动触发

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Deploy to Aliyun via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 60m
          script: |
            set -e
            # 1. 进入服务器上的项目源码目录（根据你的实际路径调整）
            cd /root/dietai-backend/ai-agent-server

            # 2. 强制对齐远端：fetch + reset --hard。
            #    用 pull 时若本地有改动/分叉会静默失败 → 源码没更新 → Docker 全部命中缓存
            #    → 几十秒“构建”完但镜像没重建（站点照旧是旧代码）。reset 只动被跟踪文件，
            #    不影响 gitignore 的 .env。echo 出提交号，方便确认这次到底部署了哪版。
            git fetch origin main
            git reset --hard origin/main
            echo "==> 部署提交: $(git rev-parse --short HEAD) $(git log -1 --pretty=%s)"

            # 3. 建：CPU 限 1.5 核 / 内存限 2G，构建再猛 SSH 也有资源响应
            systemd-run --scope --quiet \
            -p CPUQuota=150% -p MemoryMax=1200M \
            docker compose -f docker-compose.4001.yml --env-file .env build

            # 4. 再启动/更新容器
            docker compose -f docker-compose.4001.yml --env-file .env up -d --no-build

            # 4. 同步数据库表结构。本项目没有 prisma/migrations，必须用 `db push`
            #    （不是 migrate deploy，那个没迁移文件时什么都不做）。
            #    在一次性容器里跑：用刚构建的 backend 镜像（prisma CLI 已在镜像里，
            #    构建期装好，运行时无需联网下载）。--no-deps：postgres 上一步已起。
            #    Prisma 7 的 db push 不认 --skip-generate；schema 的 datasource 没有 url，
            #    所以用 --url 传连接串。`sh -c '...'` 单引号包住，让 $DATABASE_URL 在
            #    容器内（.env 注入）展开，宿主机 shell 拿不到这个变量。
            #    不加 --accept-data-loss，避免非交互下静默删列/删表。
            docker compose -f docker-compose.4001.yml --env-file .env run --rm --no-deps \
              backend sh -c 'npx prisma db push --url "$DATABASE_URL"'

            # 5. 清理未使用的旧镜像，防止服务器磁盘被撑满.
            docker image prune -f
